[project]
name = "ai-resume-analyzer"
version = "1.0.0"
description = "Score resumes against target roles and get grounded, AI-written feedback."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv", "instance"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "B008",   # function calls in defaults (Flask idioms)
    "SIM108", # ternaries are not always clearer
    "SIM905", # long word lists read better as a split string
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"services/concepts.py" = ["E501"]  # data table
